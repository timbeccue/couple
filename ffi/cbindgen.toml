language = "C"
include_guard = "COUPLE_H"
header = """/* couple.h — C ABI for couple-core (§4.9). Generated by cbindgen; do not edit.
 * All functions use the C calling convention. Opaque u64 handles. UTF-8 paths.
 * Strings returned as char* are core-allocated; free with cpl_string_free().
 * Most functions return an i32 status (0 = ok); details via cpl_take_error_json(). */"""
autogen_warning = "/* Generated by cbindgen from couple-ffi — regenerate via cargo build -p couple-ffi */"
documentation = true
documentation_style = "c"

[export]
prefix = ""

[fn]
prefix = ""

[parse]
parse_deps = false
