[package]
name = "couple-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "couple"
# staticlib: the C-ABI archive the Swift shell links (SPEC §4.9).
# rlib: lets the Electron shell's napi binding (electron/native) call the same
# `pub extern "C" cpl_*` surface as a type-checked Rust dependency instead of
# re-declaring the header — same contract, no duplicate declarations.
crate-type = ["staticlib", "rlib"]

[dependencies]
couple-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true

[build-dependencies]
cbindgen = "0.27"
