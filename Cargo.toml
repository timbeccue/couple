[workspace]
resolver = "2"
members = ["core", "cli", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
rustfft = "6"
realfft = "3"
blake3 = "1"
memmap2 = "0.9"
tempfile = "3"
crossbeam-channel = "0.5"
rand = "0.8"
rand_chacha = "0.3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
hound = "3"

[profile.release]
debug = true
