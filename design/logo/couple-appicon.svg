<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Couple app icon, Apple icon grid (1024 canvas, 824 squircle, baked drop shadow).
     The mark is the wordmark's interlocked C+O (design/logo/e-co-wordmark.svg), mask-built.
     Source for design/logo/Couple.icns — regeneration commands in design/logo/README.md. -->
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1d2127"/>
<stop offset="1" stop-color="#0e1014"/>
</linearGradient>
<filter id="dropsoft" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="12"/>
</filter>
<mask id="cutTeal" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="800">
<rect x="-200" y="-200" width="1400" height="800" fill="#ffffff"/>
<path d="M138.2 55.7 A45 45 0 0 0 101.7 92.2" fill="none" stroke="#000000" stroke-width="44"/>
</mask>
<mask id="cutAmber" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="800">
<rect x="-200" y="-200" width="1400" height="800" fill="#ffffff"/>
<path d="M117.7 124.5 A45 45 0 0 1 76.1 144.8" fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round"/>
</mask>
</defs>
<rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" opacity="0.35" filter="url(#dropsoft)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
<rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
<g transform="translate(134.2 177.7) scale(3.343)">
<path d="M117.7 75.5 A45 45 0 1 0 117.7 124.5" fill="none" stroke="#4fd9c4" stroke-width="28" stroke-linecap="round" mask="url(#cutTeal)"/>
<circle cx="146" cy="100" r="45" fill="none" stroke="#f0b35e" stroke-width="28" mask="url(#cutAmber)"/>
</g>
</svg>
