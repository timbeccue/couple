<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Couple logo prototype C (round 2, rev 2): Chain Link app icon, now sharing the wordmark's
     exact C+O geometry (design/logo/e-co-wordmark.svg) scaled onto the dark squircle.
     The weave is mask-built, so the gaps show the plate gradient and stay crisp at any zoom. -->
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1d2127"/>
<stop offset="1" stop-color="#0e1014"/>
</linearGradient>
<filter id="soft6" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="6"/>
</filter>
<mask id="cutTeal" maskUnits="userSpaceOnUse" x="-100" y="-100" width="930" height="400">
<rect x="-100" y="-100" width="930" height="400" fill="#ffffff"/>
<path d="M138.2 55.7 A45 45 0 0 0 101.7 92.2" fill="none" stroke="#000000" stroke-width="44"/>
</mask>
<mask id="cutAmber" maskUnits="userSpaceOnUse" x="-100" y="-100" width="930" height="400">
<rect x="-100" y="-100" width="930" height="400" fill="#ffffff"/>
<path d="M117.7 124.5 A45 45 0 0 1 76.1 144.8" fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round"/>
</mask>
</defs>
<ellipse cx="256" cy="410" rx="148" ry="13" fill="#000000" opacity="0.5" filter="url(#soft6)"/>
<rect x="96" y="76" width="320" height="320" rx="72" fill="url(#plate)"/>
<rect x="97.5" y="77.5" width="317" height="317" rx="70.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
<g transform="translate(109.1 106) scale(1.3)">
<path d="M117.7 75.5 A45 45 0 1 0 117.7 124.5" fill="none" stroke="#4fd9c4" stroke-width="28" stroke-linecap="round" mask="url(#cutTeal)"/>
<circle cx="146" cy="100" r="45" fill="none" stroke="#f0b35e" stroke-width="28" mask="url(#cutAmber)"/>
</g>
</svg>
