# CI for couple — enforces the repo's own gates on every push/PR:
# cargo tests (release; the integration suites say "Run with --release"),
# both Swift build variants (ship = DebugDrive stubs, dev = COUPLE_DEVHARNESS
# harness), and swift test. Everything runs on macOS because the Swift shell
# requires it and the Rust suites shell out to ffmpeg; if runner cost matters
# later, the core/cli/ffi cargo tests are POSIX-portable and can move to an
# ubuntu job (apt-get install ffmpeg) — the mac job then keeps only swift.
#
# The 33-case synthetic-corpus ROC gate (#[ignore]d, ~3.5 min locally) runs
# weekly + on demand here (corpus-gate job) AND per push/PR when matcher paths
# change — see roc-gate.yml (own workflow so native `on.paths` gates only it).
#
# Real-media suites (example_data/, matcher-corpus real splits) are inherently
# local-only: the media is gitignored (SPEC §10.1) and absent here. Those cases
# count as "unscannable" (and realdata_sync is COUPLE_REALDATA_DIR-gated),
# never failures — the media is owner convenience material, not a dependency.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # weekly corpus gate (Mondays 06:17 UTC)

env:
  CARGO_TERM_COLOR: always

jobs:
  # Non-blocking reminder: warns (annotation + job summary) when a change
  # touches one shell's UI without the other shell or SHELL-UI-PARITY.md.
  # See scripts/shell-drift-check.sh for the rules and the opt-out trailer.
  shell-drift:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell drift check (warn only)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/shell-drift-check.sh "$BASE" HEAD

  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (fixture generation + decode path)
        run: brew install ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('mac/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: cargo test (workspace, release)
        run: cargo test --release --workspace

      - name: Golden pair-rows decision diff (resolver decisions vs fixtures/golden/rows)
        run: scripts/golden-pair-rows.sh

      - name: Build FFI staticlib for the Swift package
        run: cargo build --release -p couple-ffi

      - name: swift build (ship variant — DebugDrive stubs)
        working-directory: mac
        run: swift build -c release

      - name: swift build (dev variant — COUPLE_DEVHARNESS harness)
        working-directory: mac
        run: swift build -c release -Xswiftc -DCOUPLE_DEVHARNESS

      - name: swift test
        working-directory: mac
        run: swift test

  # Electron shell (PLAN-CORE-SHELL-BOUNDARY Phase G): build the napi binding on
  # all three desktop OSes and run the §9 parity gate — the kit must produce
  # resolution decisions IDENTICAL to the CLI on shared fixtures. The smoke test
  # covers the ABI/error/policy/job plumbing without media. Packaging is
  # exercised by electron-builder without publishing.
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (fixture generation + decode path)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg
          elif [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev
          else choco install ffmpeg -y --no-progress
          fi
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        working-directory: electron
        run: npm ci

      - name: Build native binding
        working-directory: electron
        run: npm run build:native

      - name: Binding smoke test (ABI, errors, policies, job path)
        working-directory: electron
        run: npm run smoke

      - name: Renderer app/kit unit tests (Vitest, real binding)
        working-directory: electron
        run: npm test

      - name: Phase G §9 parity gate (kit rows == CLI rows)
        working-directory: electron
        run: npm run parity

      - name: Typecheck + renderer build
        working-directory: electron
        run: npx tsc --noEmit && npx electron-vite build

      - name: Package (no publish)
        working-directory: electron
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # The §10.5/§15.2 synthetic-corpus ROC gate: scores the committed 33-case
  # corpus under production defaults and asserts the frozen CALIBRATION.md §6
  # baseline (0 confident-false, 0 FP, recall >= 31/32). Weekly + on demand.
  # Kept unchanged as the drift net: toolchain/brew-ffmpeg updates can move results with no matcher-path change; per-change runs live in roc-gate.yml.
  corpus-gate:
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic-corpus ROC gate
        run: >
          cargo test --release -p couple-core --test matching_evidence
          -- --ignored synthetic_corpus_roc_gates_hold
